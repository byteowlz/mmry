[workspace]
members = [
    "crates/mmry-core",
    "crates/mmry-cli",
    "crates/mmry-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tommy Falkowski"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tommyfalkowski/mmry"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# CLI dependencies
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Configuration
toml = "0.8"
dirs = "5.0"

# Embeddings (disabled for Phase 1, will enable in Phase 2)
fastembed = "5.2"

# Fuzzy matching
strsim = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
regex = "1.10"
once_cell = "1.19"
