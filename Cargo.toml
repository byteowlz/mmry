[workspace]
members = ["crates/mmry-core", "crates/mmry-cli", "crates/mmry-mcp", "crates/mmry-tui", "crates/mmry-service"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["byteowlz"]
license = "MIT"
repository = "https://github.com/byteowlz/mmry"
# Do not publish to crates.io (set to true when ready)
publish = false

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.48", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# CLI dependencies
clap = { version = "4.5.51", features = ["derive", "env"] }
clap_complete = "4.5.51"

# Configuration
toml = "0.8"
dirs = "5.0"

# Embeddings (disabled for Phase 1, will enable in Phase 2)
fastembed = "5.2"

# Fuzzy matching
strsim = "0.11.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
regex = "1.12"
once_cell = "1.19"
sqlite-vec = "0.1.7-alpha.2"
zerocopy = "0.8.27"
tempfile = "3.10"
tokenizers = "0.22"
libc = "0.2"
