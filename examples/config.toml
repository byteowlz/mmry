"$schema" = "https://raw.githubusercontent.com/byteowlz/schemas/refs/heads/main/mmry/mmry.config.schema.json"
# @schema ./config.schema.json
# Example mmry configuration file
# Place this at ~/.config/mmry/config.toml or $XDG_CONFIG_HOME/mmry/config.toml
#
# Note: Paths support tilde (~) expansion and environment variables
# Examples:
#   - "~/path/to/file" expands to "$HOME/path/to/file"
#   - "$XDG_DATA_HOME/mmry" expands based on the environment
#   - "$HOME/.local/share/mmry" works too

[database]
# Path to the SQLite database file (legacy, prefer using stores)
# You can use ~ or environment variables like $HOME or $XDG_DATA_HOME
path = "~/.local/share/mmry/memories.db"
# Backup database on startup
backup_on_startup = true
# Days to keep backup files
backup_retention_days = 30

[stores]
# Directory where store databases are kept
# Each store is a separate SQLite database file: <directory>/<store_name>.db
directory = "~/.local/share/mmry/stores"
# Default store to use when --store is not specified
# Create stores with: mmry stores create <name>
# List stores with: mmry stores list
default = "default"

[embeddings]
# Enable embeddings for semantic search
enabled = true
# Embedding model to use (fastembed model codes)
# Popular options:
#   - "Xenova/all-MiniLM-L6-v2" (default, fast, 384 dimensions)
#   - "Xenova/bge-small-en-v1.5" (better quality, 384 dimensions)
#   - "Xenova/bge-base-en-v1.5" (even better quality, 768 dimensions)
#   - "nomic-ai/nomic-embed-text-v1.5" (high quality, 768 dimensions)
model = "Xenova/all-MiniLM-L6-v2"
# Backend to use (currently only "fastembed" is supported)
backend = "fastembed"
# Dimension of embeddings (must match model)
dimension = 384
# Batch size for embedding generation
batch_size = 32

# Optional: delegate embedding to a remote mmry-service HTTP API
# This avoids loading the model locally. Useful when a central mmry-service
# is running (e.g., via oqto multi-user setup).
# [embeddings.remote]
# base_url = "http://127.0.0.1:8081"
# api_key = ""
# request_timeout_seconds = 30
# max_batch_size = 64
# required = false  # if true, fail hard on remote errors; if false, fall back to local

[sparse_embeddings]
# Enable sparse embeddings (SPLADE++) for neural sparse retrieval
enabled = false
# Sparse embedding model (currently only SPLADE++ is supported)
model = "Qdrant/Splade_PP_en_v1"

[search]
# Default number of results to return
default_limit = 10
# Minimum similarity score for vector search (0.0-1.0)
similarity_threshold = 0.7
# Search mode: hybrid, keyword, fuzzy, semantic, bm25, or sparse
# - hybrid: combines multiple search strategies (default)
# - keyword: exact and partial keyword matching
# - fuzzy: approximate string matching (typo-tolerant)
# - semantic: dense vector embeddings for conceptual similarity
# - bm25: BM25 statistical relevance (like traditional search engines)
# - sparse: SPLADE++ learned sparse embeddings
mode = "hybrid"
# Boost recently created memories
boost_recent = true
# Weight for recency boost (0.0-1.0)
recency_weight = 0.3
# Enable reranking for better search results
rerank_enabled = true
# Number of top results to rerank
rerank_top_k = 20
# Reranker model (optional)
# Available models (run `mmry rerankers` to see all):
#   - "BAAI/bge-reranker-base" (default, English and Chinese)
#   - "rozgo/bge-reranker-v2-m3" (multilingual)
#   - "jinaai/jina-reranker-v1-turbo-en" (fast, English)
#   - "jinaai/jina-reranker-v2-base-multilingual" (multilingual)
rerank_model = "BAAI/bge-reranker-base"
# Scoring weights for hybrid mode (should sum to ~0.8-1.0 before recency/importance)
keyword_weight = 0.4          # Exact/partial keyword matches
fuzzy_weight = 0.2            # Fuzzy string matching
vector_weight = 0.35          # Dense embeddings similarity
bm25_weight = 0.0             # BM25 statistical scoring (set to 0.2-0.3 to enable)
sparse_embedding_weight = 0.0 # SPLADE++ sparse embeddings (set to 0.2-0.3 to enable)
importance_weight = 0.05      # Memory importance boost
# Episode-feedback prior: adds `feedback_weight * log1p(max(0, helpful - harmful))`
# to the final score. Memories cited via `mmry add --using <ids>` accumulate
# helpful_count and rise in future searches. Set to 0.0 to disable the loop.
feedback_weight = 0.1
# BM25 parameters (for bm25 search mode or hybrid with bm25_weight > 0)
bm25_k1 = 1.2 # Term frequency saturation (1.2-2.0 typical)
bm25_b = 0.75 # Length normalization (0.0-1.0, 0.75 typical)

# Optional: delegate reranking to a remote mmry-service HTTP API
# [search.remote_rerank]
# base_url = "http://127.0.0.1:8081"
# api_key = ""
# request_timeout_seconds = 30
# max_batch_size = 64
# required = false

[memory]
# Default category for memories
default_category = "default"
# Automatically deduplicate similar memories
auto_dedupe = true
# Similarity threshold for deduplication (0.0-1.0)
dedupe_threshold = 0.95
# Automatically score importance of memories
importance_auto_score = true

[chunking]
# Enable automatic chunking of long memories
enabled = true
# Maximum tokens per chunk (adjust based on embedding model)
# Model limits: MiniLM (256), BGE/GTE (512), Nomic/ModernBERT (8192)
max_chunk_tokens = 200
# Minimum chunk size (prevents tiny chunks)
min_chunk_tokens = 50
# Hard limit for maximum tokens (supports long-context models)
max_tokens_hard_limit = 8192
# Number of tokens to overlap between chunks
overlap_tokens = 25
# Paragraph separator (tries "\n\n" then "\n")
paragraph_separator = "\n\n"
# Generate embeddings for metadata (tags, category, type)
embed_metadata = true
# Weight for metadata in search (0.0-1.0)
metadata_weight = 0.1
# Enable deduplication across chunks
dedupe_chunks = false
# Similarity threshold for chunk deduplication (0.0-1.0)
dedupe_chunk_threshold = 0.98

[ingest]
# Use ingestr to convert non-text files (PDF, DOCX, etc.) to Markdown
ingestr_enabled = false
# Path to ingestr binary (or just "ingestr" if on PATH)
ingestr_bin = "ingestr"
# Optional directory for converted Markdown output (uses temp dir if unset)
# ingestr_output_dir = "~/.local/share/mmry/ingest"
# Timeout for ingestr conversion in seconds
ingestr_timeout_seconds = 300

[entities]
# Extract entities from memories
extract_enabled = true
# Automatically link related entities
auto_link = true
# Entity types to extract
types = ["person", "place", "organization", "project", "technology"]

[cleanup]
# Automatically prune old/low-importance memories
auto_prune = false
# Age threshold for pruning (days)
prune_threshold_days = 365
# Minimum importance to keep (1-10)
prune_importance_min = 2

[integrations.lst]
# Enable lst (todo/notes) integration
enabled = true
# Path to lst data directory (auto-detected if not set)
# Supports ~ and environment variables like $XDG_DATA_HOME
# data_dir = "~/.local/share/lst"
# Only import completed tasks
only_completed = true
# Interactive mode for lst integration
interactive = true
# Minimum task length to import
min_task_length = 10
# Minimum note length to import
min_note_length = 20

[service]
# Enable background service for faster embeddings (keeps model loaded)
# When enabled, embedding requests use the daemon service instead of loading
# the model on every invocation, reducing latency from seconds to milliseconds
enabled = false
# Automatically start service if not running
auto_start = true
# Unload models after N seconds of inactivity (0 = never unload)
# This saves memory when the service is idle
idle_timeout_seconds = 300
# Preload embedding model on service startup
preload_models = true

[external_api]
# Expose HTTP endpoints for embeddings (/v1/embeddings) and reranking (/v1/rerank)
enabled = false
# Enable the local-only agent console UI endpoints (/console)
console_enabled = false
# Redact secrets by default in the console UI
console_redact_secrets = true
# Enforce API key (Authorization: Bearer <key>); set to false to allow unauthenticated access
require_api_key = false
# Bind address for the external API
host = "127.0.0.1"
port = 8081
# Optional API key for requests (Authorization: Bearer <key>); leave empty to disable auth
# api_key = ""
# Maximum characters allowed per input or query
max_input_chars = 16000
# Maximum number of items allowed per batch request
max_batch_size = 64
# Request timeout in seconds for embedding and rerank calls
request_timeout_seconds = 30

[analyzer]
# Enable analyzer-backed features (fact extraction, intelligent routing)
# When enabled, uses LLM for smarter fact extraction and bridge block routing
enabled = false
# Model identifier (e.g., "gpt-4o-mini", "qwen/qwen3-coder-30b")
# model = "gpt-4o-mini"
# HTTP endpoint for OpenAI-compatible API
# For local LLM (LM Studio, Ollama, vLLM): "http://127.0.0.1:1234/v1"
# For OpenAI: "https://api.openai.com/v1" (set OPENAI_API_KEY env var)
# endpoint = "http://127.0.0.1:1234/v1"
# Number of retries for transient failures
retry_count = 3
# Base backoff in milliseconds between retries
retry_backoff_ms = 1000
