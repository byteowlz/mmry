[database]
path = "bench/mmry.db"
backup_on_startup = false
backup_retention_days = 0

[stores]
directory = "bench/stores"
default = "bench-default"

[service]
enabled = false

[embeddings]
enabled = true
backend = "fastembed"
model = "Xenova/all-MiniLM-L6-v2"
dimension = 384
batch_size = 32

[sparse_embeddings]
enabled = false

[search]
mode = "Hybrid"
rerank_enabled = false
boost_recent = false
