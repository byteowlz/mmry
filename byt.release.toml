# Release config consumed by `byt release` (ADR-0021).
# The reusable workflow builds linux-gnu in the byt container (glibc floor) and
# *-apple-darwin natively on a macOS runner, then combines + publishes.
#
[release]
name = "mmry"
lang = "rust"
bins = ["mmry"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[release.homebrew]
formula = "mmry"

[release.aur]
pkgname = "mmry"
pkgdesc = "An append-only workspace memory ledger"
license = "MIT"
url = "https://github.com/byteowlz/mmry"
depends = ["gcc-libs"]
