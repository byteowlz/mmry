[package]
name = "mmry-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mmry"
path = "src/main.rs"

[dependencies]
mmry-core = { path = "../mmry-core" }

tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }

# TUI dependencies (for future interactive mode)
ratatui = "0.28"
crossterm = "0.28"

# Interactive selection
dialoguer = "0.11"
libc = "0.2.177"

[features]
default = []
ort-coreml = ["mmry-core/ort-coreml"]
ort-cuda = ["mmry-core/ort-cuda"]
ort-directml = ["mmry-core/ort-directml"]
ort-openvino = ["mmry-core/ort-openvino"]
ort-tensorrt = ["mmry-core/ort-tensorrt"]
ort-rocm = ["mmry-core/ort-rocm"]
ort-nnapi = ["mmry-core/ort-nnapi"]
ort-xnnpack = ["mmry-core/ort-xnnpack"]
ort-load-dynamic = ["mmry-core/ort-load-dynamic"]
