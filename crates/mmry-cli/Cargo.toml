[package]
name = "mmry-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mmry"
path = "src/main.rs"

[dependencies]
mmry-core = { path = "../mmry-core", default-features = false, features = ["service"] }

tokio = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }

# TUI dependencies (for future interactive mode)
ratatui = "0.28"
crossterm = "0.28"

# Interactive selection
dialoguer = "0.11"

# Ingestion dependencies
notify = "7.0"
walkdir = "2.5"
serde_yaml = "0.9"
futures = "0.3"

[dev-dependencies]
tempfile = { workspace = true }

[features]
service = ["mmry-core/service"]
federation = ["mmry-core/federation"]
default = ["service", "federation"]
