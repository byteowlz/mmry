[package]
name = "mmry-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mmry"
path = "src/main.rs"

[dependencies]
mmry-core = { path = "../mmry-core", features = ["service"] }

tokio = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }

# TUI dependencies (for future interactive mode)
ratatui = "0.28"
crossterm = "0.28"

# Interactive selection
dialoguer = "0.11"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["service", "ner"]
service = ["mmry-core/service"]
ner = ["mmry-core/ner"]
ort-coreml = ["mmry-core/ort-coreml", "ner"]
ort-cuda = ["mmry-core/ort-cuda", "ner"]
ort-directml = ["mmry-core/ort-directml", "ner"]
ort-openvino = ["mmry-core/ort-openvino", "ner"]
ort-tensorrt = ["mmry-core/ort-tensorrt", "ner"]
ort-rocm = ["mmry-core/ort-rocm", "ner"]
ort-nnapi = ["mmry-core/ort-nnapi", "ner"]
ort-xnnpack = ["mmry-core/ort-xnnpack", "ner"]
ort-load-dynamic = ["mmry-core/ort-load-dynamic", "ner"]
