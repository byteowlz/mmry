[package]
name = "mmry-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mmry-service"
path = "src/main.rs"

[dependencies]
mmry-core = { path = "../mmry-core" }

tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }

# gRPC
tonic = "0.12"
prost = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }

# Process management
sysinfo = "0.32"

[build-dependencies]
tonic-build = "0.12"

[features]
default = []
ort-coreml = ["mmry-core/ort-coreml"]
ort-cuda = ["mmry-core/ort-cuda"]
ort-directml = ["mmry-core/ort-directml"]
ort-openvino = ["mmry-core/ort-openvino"]
ort-tensorrt = ["mmry-core/ort-tensorrt"]
ort-rocm = ["mmry-core/ort-rocm"]
ort-nnapi = ["mmry-core/ort-nnapi"]
ort-xnnpack = ["mmry-core/ort-xnnpack"]
ort-load-dynamic = ["mmry-core/ort-load-dynamic"]
