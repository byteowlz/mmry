syntax = "proto3";

package mmry.embeddings;

service EmbeddingService {
  // Embed a single text
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  
  // Embed multiple texts in batch
  rpc EmbedBatch(EmbedBatchRequest) returns (EmbedBatchResponse);
  
  // Get token count for text
  rpc GetTokenCount(TokenCountRequest) returns (TokenCountResponse);
  
  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);
  
  // Graceful shutdown
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  
  // Ping to keep service alive
  rpc Ping(PingRequest) returns (PingResponse);

  // Run search using server-side database and models
  rpc Search(SearchRequest) returns (SearchResponse);
}

message EmbedRequest {
  string text = 1;
}

message EmbedResponse {
  repeated float embedding = 1;
}

message EmbedBatchRequest {
  repeated string texts = 1;
}

message EmbedBatchResponse {
  repeated Embedding embeddings = 1;
}

message Embedding {
  repeated float values = 1;
}

message TokenCountRequest {
  string text = 1;
}

message TokenCountResponse {
  uint32 token_count = 1;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string status = 2;
  uint64 uptime_seconds = 3;
  uint64 requests_served = 4;
  uint64 last_activity_seconds = 5;
  bool model_loaded = 6;
}

message ShutdownRequest {}

message ShutdownResponse {
  bool success = 1;
}

message PingRequest {}

message PingResponse {
  uint64 timestamp = 1;
}

enum SearchMode {
  HYBRID = 0;
  KEYWORD = 1;
  FUZZY = 2;
  SEMANTIC = 3;
  BM25 = 4;
  SPARSE = 5;
}

message SearchRequest {
  string query = 1;
  int64 limit = 2;
  string category = 3;
  SearchMode mode = 4;
  bool rerank = 5;
  string store = 6;
  // Filter fields
  repeated string tags = 8;
  string memory_type = 9;
  int32 min_importance = 10;
  string after = 11;
  string before = 12;
}

message SparseEmbeddingData {
  repeated uint32 indices = 1;
  repeated float values = 2;
}

message MemoryResult {
  string id = 1;
  string memory_type = 2;
  string content = 3;
  repeated float embedding = 4;
  SparseEmbeddingData sparse_embedding = 5;
  string metadata_json = 6;
  int32 importance = 7;
  string created_at = 8;
  string updated_at = 9;
  string category = 10;
  repeated string tags = 11;
  string parent_id = 12;
  int32 chunk_index = 13;
  int32 total_chunks = 14;
}

message SearchResponse {
  repeated MemoryResult memories = 1;
}
