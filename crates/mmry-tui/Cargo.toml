[package]
name = "mmry-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mmry-core = { path = "../mmry-core" }
ratatui = "0.28"
crossterm = "0.28"
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tempfile = "3.10"
chrono = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }

[[bin]]
name = "mmry-tui"
path = "src/main.rs"

[features]
default = []
ort-coreml = ["mmry-core/ort-coreml"]
ort-cuda = ["mmry-core/ort-cuda"]
ort-directml = ["mmry-core/ort-directml"]
ort-openvino = ["mmry-core/ort-openvino"]
ort-tensorrt = ["mmry-core/ort-tensorrt"]
ort-rocm = ["mmry-core/ort-rocm"]
ort-nnapi = ["mmry-core/ort-nnapi"]
ort-xnnpack = ["mmry-core/ort-xnnpack"]
ort-load-dynamic = ["mmry-core/ort-load-dynamic"]
