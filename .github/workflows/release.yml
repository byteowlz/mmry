name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.7.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            features: ""
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            features: ""
          # macOS Intel (cross-compiled from ARM64 runner)
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
            features: ""
          # macOS Apple Silicon (with CoreML acceleration)
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            features: "--features coreml"
          # Windows (disabled: C runtime mismatch between esaxx-rs and ort-sys)
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   archive: zip
          #   features: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} ${{ matrix.features }}
          else
            cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
          fi

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          # Package all binaries
          tar czvf ../../../mmry-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz mmry mmry-mcp mmry-tui mmry-service

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mmry-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip mmry.exe mmry-mcp.exe mmry-tui.exe mmry-service.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmry-${{ matrix.target }}
          path: mmry-${{ env.RELEASE_TAG }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          sha256sum *.tar.gz > checksums.txt
          if ls *.zip 1>/dev/null 2>&1; then
            sha256sum *.zip >> checksums.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    name: Publish to Homebrew
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: byteowlz/homebrew-tap
          event-type: update-formula
          client-payload: |
            {
              "formula": "mmry",
              "version": "${{ env.RELEASE_TAG }}",
              "repo": "${{ github.repository }}"
            }

  publish-aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkgname: mmry
            pkgdesc: "A lean, local-first memory management system for humans and AI agents"
            depends: "('gcc-libs')"
            makedepends: ""
            optdepends: ""
            conflicts: "('mmry-cuda')"
            provides: "('mmry')"
          - pkgname: mmry-cuda
            pkgdesc: "A lean, local-first memory management system for humans and AI agents (with CUDA support)"
            depends: "('gcc-libs' 'cuda')"
            makedepends: "('rust' 'cargo' 'protobuf')"
            optdepends: "('cudnn: for improved neural network performance')"
            conflicts: "('mmry')"
            provides: "('mmry')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Generate PKGBUILD (binary)
        if: matrix.pkgname == 'mmry'
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          
          # Download checksums
          curl -sL "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/checksums.txt" -o checksums.txt
          
          SHA256_X86=$(grep "x86_64-unknown-linux-gnu.tar.gz" checksums.txt | cut -d' ' -f1)
          SHA256_ARM=$(grep "aarch64-unknown-linux-gnu.tar.gz" checksums.txt | cut -d' ' -f1)
          
          cat > PKGBUILD << 'EOF'
          # Maintainer: byteowlz
          pkgname=mmry
          pkgver=VERSION_PLACEHOLDER
          pkgrel=1
          pkgdesc="A lean, local-first memory management system for humans and AI agents"
          arch=('x86_64' 'aarch64')
          url="https://github.com/byteowlz/mmry"
          license=('MIT')
          depends=('gcc-libs')
          conflicts=('mmry-cuda')
          provides=('mmry')
          source_x86_64=("$pkgname-$pkgver-x86_64.tar.gz::https://github.com/byteowlz/mmry/releases/download/v$pkgver/mmry-v$pkgver-x86_64-unknown-linux-gnu.tar.gz")
          source_aarch64=("$pkgname-$pkgver-aarch64.tar.gz::https://github.com/byteowlz/mmry/releases/download/v$pkgver/mmry-v$pkgver-aarch64-unknown-linux-gnu.tar.gz")
          sha256sums_x86_64=('SHA256_X86_PLACEHOLDER')
          sha256sums_aarch64=('SHA256_ARM_PLACEHOLDER')
          
          package() {
              install -Dm755 mmry "$pkgdir/usr/bin/mmry"
              install -Dm755 mmry-mcp "$pkgdir/usr/bin/mmry-mcp"
              install -Dm755 mmry-tui "$pkgdir/usr/bin/mmry-tui"
              install -Dm755 mmry-service "$pkgdir/usr/bin/mmry-service"
          }
          EOF
          
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" PKGBUILD
          sed -i "s/SHA256_X86_PLACEHOLDER/${SHA256_X86}/g" PKGBUILD
          sed -i "s/SHA256_ARM_PLACEHOLDER/${SHA256_ARM}/g" PKGBUILD

      - name: Generate PKGBUILD (CUDA)
        if: matrix.pkgname == 'mmry-cuda'
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          
          cat > PKGBUILD << 'EOF'
          # Maintainer: byteowlz
          pkgname=mmry-cuda
          pkgver=VERSION_PLACEHOLDER
          pkgrel=1
          pkgdesc="A lean, local-first memory management system for humans and AI agents (with CUDA support)"
          arch=('x86_64')
          url="https://github.com/byteowlz/mmry"
          license=('MIT')
          depends=('gcc-libs' 'cuda')
          makedepends=('rust' 'cargo' 'protobuf')
          optdepends=('cudnn: for improved neural network performance')
          conflicts=('mmry')
          provides=('mmry')
          source=("$pkgname-$pkgver.tar.gz::https://github.com/byteowlz/mmry/archive/refs/tags/v$pkgver.tar.gz")
          sha256sums=('SKIP')
          
          build() {
              cd "mmry-$pkgver"
              export RUSTUP_TOOLCHAIN=stable
              export CARGO_TARGET_DIR=target
              cargo build --release --features cuda
          }
          
          package() {
              cd "mmry-$pkgver"
              install -Dm755 target/release/mmry "$pkgdir/usr/bin/mmry"
              install -Dm755 target/release/mmry-mcp "$pkgdir/usr/bin/mmry-mcp"
              install -Dm755 target/release/mmry-tui "$pkgdir/usr/bin/mmry-tui"
              install -Dm755 target/release/mmry-service "$pkgdir/usr/bin/mmry-service"
              install -Dm644 LICENSE "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
          }
          EOF
          
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild: ./PKGBUILD
          commit_username: byteowlz
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.RELEASE_TAG }}"

