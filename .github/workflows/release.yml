name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.7.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            features: ""
          # Linux ARM64 (disabled: needs Cross.toml with OpenSSL config)
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   archive: tar.gz
          #   cross: true
          #   features: ""
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            features: ""
          # macOS Apple Silicon (with CoreML acceleration)
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            features: "--features coreml"
          # Windows (disabled: C runtime mismatch between esaxx-rs and ort-sys)
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   archive: zip
          #   features: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} ${{ matrix.features }}
          else
            cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
          fi

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          # Package all binaries
          tar czvf ../../../mmry-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz mmry mmry-mcp mmry-tui mmry-service

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mmry-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip mmry.exe mmry-mcp.exe mmry-tui.exe mmry-service.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmry-${{ matrix.target }}
          path: mmry-${{ env.RELEASE_TAG }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          sha256sum *.tar.gz > checksums.txt
          if ls *.zip 1>/dev/null 2>&1; then
            sha256sum *.zip >> checksums.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    name: Publish to Homebrew
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: byteowlz/homebrew-tap
          event-type: update-formula
          client-payload: |
            {
              "formula": "mmry",
              "version": "${{ env.RELEASE_TAG }}",
              "repo": "${{ github.repository }}"
            }

  publish-aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Generate PKGBUILD
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          
          # Download checksums
          curl -sL "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/checksums.txt" -o checksums.txt
          
          SHA256=$(grep "x86_64-unknown-linux-gnu.tar.gz" checksums.txt | cut -d' ' -f1)
          
          cat > PKGBUILD << EOF
          # Maintainer: byteowlz
          pkgname=mmry
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="A lean, local-first memory management system for humans and AI agents"
          arch=('x86_64')
          url="https://github.com/byteowlz/mmry"
          license=('MIT')
          depends=('gcc-libs')
          source=("\$pkgname-\$pkgver.tar.gz::https://github.com/byteowlz/mmry/releases/download/v\$pkgver/mmry-v\$pkgver-x86_64-unknown-linux-gnu.tar.gz")
          sha256sums=('${SHA256}')
          
          package() {
              install -Dm755 mmry "\$pkgdir/usr/bin/mmry"
              install -Dm755 mmry-mcp "\$pkgdir/usr/bin/mmry-mcp"
              install -Dm755 mmry-tui "\$pkgdir/usr/bin/mmry-tui"
              install -Dm755 mmry-service "\$pkgdir/usr/bin/mmry-service"
          }
          EOF

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: mmry
          pkgbuild: ./PKGBUILD
          commit_username: byteowlz
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.RELEASE_TAG }}"

