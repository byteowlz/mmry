id: rust-no-unwrap-expect
language: Rust
severity: error
message: "Avoid unwrap/expect in production Rust code; propagate errors with anyhow::Context or explicit handling."
note: |
  AI-generated code tends to introduce unwrap()/expect() shortcuts.
  Prefer proper error handling and context propagation.
rule:
  any:
    - pattern: $X.unwrap()
    - pattern: $X.expect($MSG)
  # Test modules may unwrap fixtures (mirrors clippy.toml allow-*-in-tests).
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        stopBy:
          not:
            kind: attribute_item
        pattern: "#[cfg(test)]"
# Cargo integration tests are test-only crates (see clippy.toml allow-*-in-tests).
ignores:
  - "crates/*/tests/**"
